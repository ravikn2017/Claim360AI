[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claim360ai"
version = "1.0.0"
description = "Agentic AI Workflow for Claims Adjudication and Communication of Review Outcome"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["claim360ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
